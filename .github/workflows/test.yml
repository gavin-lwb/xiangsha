name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme xiangsha \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -enableCodeCoverage YES \
            -resultBundlePath /tmp/xiangsha-cov.xcresult \
            2>&1 | xcbeautify || \
          xcodebuild test \
            -scheme xiangsha \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: /tmp/xiangsha-cov.xcresult
